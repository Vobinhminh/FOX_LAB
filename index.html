<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoxLab v6.5.2 - Dao Dong Ky & Do Luong</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f8fafc; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    button { padding: 8px 14px; border: 1px solid #0f172a; background: #0f172a; color: #fff; border-radius: 6px; cursor: pointer; margin-right: 8px; }
    button.secondary { background: #fff; color: #0f172a; }
    canvas { width: 100%; max-width: 780px; height: 220px; border: 1px solid #cbd5e1; background: #ffffff; display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>FoxLab v6.5.2 - Dao Dong Ky</h1>
    <p>Phien ban da dong bo du lieu dao ham tho (rawU, rawV, rawA) cho tung lan do.</p>
    <button id="btnSample">Ghi nhan mau dao dong (440 Hz)</button>
    <button id="btnReport" class="secondary" onclick="window.location.href='report.html'">Mo trang bao cao</button>
    <button id="btnClear" class="secondary">Xoa du lieu mau</button>
    <p id="statusText">San sang ghi nhan.</p>
    <canvas id="scopeCanvas" width="780" height="220"></canvas>
  </div>

  <script src="index.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');

    function drawWaveform(tMs, rawU, rawV, rawA) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const midY = canvas.height / 2;
      ctx.strokeStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.moveTo(0, midY);
      ctx.lineTo(canvas.width, midY);
      ctx.stroke();

      if (!rawU || rawU.length === 0) return;
      const stepX = canvas.width / Math.max(rawU.length - 1, 1);

      const drawSeries = (arr, color, scale) => {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        arr.forEach((val, idx) => {
          const x = idx * stepX;
          const y = midY - val * scale;
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      };

      drawSeries(rawU, '#0f172a', 70);
      drawSeries(rawV, '#2563eb', 0.08);
      drawSeries(rawA, '#dc2626', 0.0001);
    }

    document.getElementById('btnSample').addEventListener('click', () => {
      const sampleCount = 120;
      const tMs = [];
      const uVal = [];
      const freq = 440;
      for (let i = 0; i < sampleCount; i++) {
        const tSec = i * 0.00005;
        tMs.push(Number((tSec * 1000).toFixed(4)));
        uVal.push(Math.sin(2 * Math.PI * freq * tSec));
      }
      const saved = window.FoxLabCore.recordMeasurement('Am thoa 440 Hz', tMs, uVal);
      drawWaveform(saved.tMs, saved.rawU, saved.rawV, saved.rawA);
      document.getElementById('statusText').textContent =
        'Da luu ' + saved.label + ' (' + saved.rawU.length + ' mau rawU, rawV, rawA).';
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      window.FoxLabCore.clearMeasurements();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      document.getElementById('statusText').textContent = 'Da xoa toan bo du lieu do.';
    });
  </script>
</body>
</html>
