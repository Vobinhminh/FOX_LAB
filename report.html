<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bao cao du lieu thuc nghiem - FoxLab v6.5.2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Bao cao do thi dao ham so (FoxLab v6.5.2)</h1>
      <p>Hien thi day du mang du lieu thuc nghiem rawU, rawV, rawA cua tung lan do.</p>
      <div class="toolbar">
        <button onclick="window.location.href='index.html'">Quay lai dao dong ky</button>
      </div>
    </div>
    <div id="reportContainer"></div>
  </div>

  <script src="index.js"></script>
  <script>
    const container = document.getElementById('reportContainer');
    const records = window.FoxLabCore.getAllMeasurements();

    if (!records.length) {
      container.innerHTML = '<div class="card"><p>Chua co du lieu do nao duoc ghi nhan.</p></div>';
    } else {
      records.forEach((rec, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('h2');
        title.textContent = (index + 1) + '. ' + rec.label + ' (' + rec.timestamp + ')';
        card.appendChild(title);

        const meta = document.createElement('p');
        meta.className = 'meta-text';
        meta.textContent = 'So mau rawU: ' + (rec.rawU ? rec.rawU.length : 0) +
          ' | rawV: ' + (rec.rawV ? rec.rawV.length : 0) +
          ' | rawA: ' + (rec.rawA ? rec.rawA.length : 0);
        card.appendChild(meta);

        const canvas = document.createElement('canvas');
        canvas.className = 'report-canvas';
        canvas.width = 780;
        canvas.height = 180;
        card.appendChild(canvas);
        container.appendChild(card);

        const ctx = canvas.getContext('2d');
        const midY = canvas.height / 2;
        ctx.strokeStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.moveTo(0, midY);
        ctx.lineTo(canvas.width, midY);
        ctx.stroke();

        const seriesList = [
          { arr: rec.rawU || [], color: '#0f172a', scale: 60 },
          { arr: rec.rawV || [], color: '#2563eb', scale: 0.07 },
          { arr: rec.rawA || [], color: '#dc2626', scale: 0.00008 }
        ];

        seriesList.forEach(({ arr, color, scale }) => {
          if (!arr.length) return;
          const stepX = canvas.width / Math.max(arr.length - 1, 1);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          arr.forEach((val, idx) => {
            const x = idx * stepX;
            const y = midY - val * scale;
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.stroke();
        });
      });
    }
  </script>
</body>
</html>
